name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Integration tests (headless)
        run: xvfb-run -a npm run test:integration
      - run: npm run compile -- --production
      - run: npm run package

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: '*.vsix'
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # --- Registry publishing: built now, dormant until PUBLISH_ENABLED=true ---
      - name: Publish to VS Code Marketplace
        if: vars.PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        run: npm run deploy:vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: vars.PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        run: npm run deploy:ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
