name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Assert @types/vscode matches engines.vscode floor
        run: |
          node -e '
            const p = require("./package.json");
            const floor = p.engines.vscode.replace(/^[\^~]/, "");
            const types = p.devDependencies["@types/vscode"].replace(/^[\^~]/, "");
            if (types !== floor) {
              console.error(`@types/vscode (${types}) must equal engines.vscode floor (${floor})`);
              process.exit(1);
            }
            console.log(`OK: @types/vscode == engines.vscode floor (${floor})`);
          '

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile -- --production
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: meldx-vsix
          path: '*.vsix'
